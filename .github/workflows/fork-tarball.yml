# Fork rolling tarball (traditional Linux packaging, no Nix).
#
# Push to release_fork -> build Release nvim on ubuntu-24.04, pack the
# `DESTDIR` payload (contents of stage/usr: bin/ lib/ share/) as
# neovim-linux-x86_64.tar.gz, force-move the rolling tag `fork-linux-x86_64`,
# upload the tarball, fill version/hash into dist/nix/neovim-fork.nix, upload
# that too, then verify with a real `nix build` of the uploaded tarball URL
# plus a smoke run of the built $out/bin/nvim.
#
# dotfiles consumes this via pkgs/update-fork-tarballs.sh which just downloads
# the generated neovim-fork.nix — no source fetch, no hash recomputation.
# Replaces .github/workflows/cachix-fork.yml (deleted).
name: Fork Tarball

on:
  push:
    branches:
      - release_fork
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-tarball-${{ github.ref }}
  cancel-in-progress: true

env:
  ROLL_TAG: fork-linux-x86_64
  TARBALL: neovim-linux-x86_64.tar.gz
  NIX_ASSET: neovim-fork.nix
  NIXPKGS_TARBALL: https://channels.nixos.org/nixos-unstable/nixexprs.tar.zst

jobs:
  tarball:
    name: Build, publish and verify tarball
    if: github.repository == 'WantenMN/neovim'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          dotnet: false
          large-packages: false

      - name: Install build dependencies
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl gettext ninja-build luajit pkg-config unzip

      - name: Compute rolling version
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          short_sha=$(git rev-parse --short HEAD)
          ver_date=$(date -u +%Y.%m.%d)
          # Keep upstream version prefix so the build is identifiable.
          upstream=$(grep -oP 'NVIM_VERSION_(MAJOR|MINOR|PATCH|PRERELEASE)\s+\S+' CMakeLists.txt | head -n 4 || true)
          echo "upstream: $upstream"
          echo "roll_version=0.13.0-dev-${ver_date}-g${short_sha}" >> "$GITHUB_ENV"
          echo "short_sha=${short_sha}" >> "$GITHUB_ENV"
          echo "ver_date=${ver_date}" >> "$GITHUB_ENV"

      - name: Configure (Release, prefix /usr)
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        shell: bash --noprofile --norc -eo pipefail {0}
        run: cmake --build build -j"$(nproc)"

      - name: Install to stage and pack tarball
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          rm -rf stage
          mkdir -p stage
          DESTDIR="$PWD/stage" cmake --install build
          # Build provenance for the tarball (top level, next to bin/).
          printf 'version=%s\ncommit=%s\ndate=%s\nsource=release_fork\n' \
            "$roll_version" "$GITHUB_SHA" "$ver_date" > stage/usr/BUILD-INFO.txt
          tar -czf "$TARBALL" -C stage/usr .
          ls -lh "$TARBALL"
          tar -tzf "$TARBALL" | head -n 30

      - name: Smoke test staged payload
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          rm -rf /tmp/nvim-smoke
          mkdir -p /tmp/nvim-smoke
          tar -xzf "$TARBALL" -C /tmp/nvim-smoke
          /tmp/nvim-smoke/bin/nvim --version | head -n 5
          /tmp/nvim-smoke/bin/nvim --headless +'qa!'

      - name: Install nix (verification only)
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Publish tarball to rolling release
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f "$ROLL_TAG"
          git push -f origin "$ROLL_TAG"
          if ! gh release view "$ROLL_TAG" >/dev/null 2>&1; then
            gh release create "$ROLL_TAG" \
              --title "Neovim fork rolling (linux x86_64)" \
              --notes "Rolling prebuilt tarball from release_fork. Updated on every push; nix consumers fetch ${NIX_ASSET}." \
              --target release_fork
          fi
          gh release upload "$ROLL_TAG" "$TARBALL" --clobber

      - name: Generate + publish verified .nix and verify nix build
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://github.com/WantenMN/neovim/releases/download/${ROLL_TAG}/${TARBALL}"
          # Download back through the release URL: proves the asset is live
          # and yields the exact hash nix consumers will see.
          sri=$(nix store prefetch-file --json "$url" | jq -r .hash)
          echo "sri: $sri"
          if [ -z "$sri" ] || [ "$sri" = "null" ]; then
            echo "error: failed to prefetch $url" >&2
            exit 1
          fi
          sed -i -E \
            -e "s|version = \".*\";|version = \"${roll_version}\";|" \
            -e "s|hash = \"sha256-.*\";|hash = \"${sri}\";|" \
            "dist/nix/${NIX_ASSET}"
          grep -nE 'version = |url = |hash = ' "dist/nix/${NIX_ASSET}"
          gh release upload "$ROLL_TAG" "dist/nix/${NIX_ASSET}" --clobber
          # Verify exactly what dotfiles will build: nixpkgs + fetchurl(tarball).
          out=$(nix build -L --impure --no-link --print-out-paths --expr \
            "let pkgs = import (builtins.fetchTarball { url = \"$NIXPKGS_TARBALL\"; }) {}; in pkgs.callPackage ./dist/nix/${NIX_ASSET} {}")
          echo "built: $out"
          "$out/bin/nvim" --version | head -n 5
          "$out/bin/nvim" --headless +'qa!'
          test -L "$out/share/applications/nvim.desktop" || test -f "$out/share/applications/nvim.desktop"
